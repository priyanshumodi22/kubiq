apiVersion: v1
kind: Namespace
metadata:
  name: kubiq-system
  labels:
    app.kubernetes.io/part-of: kubiq
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: kubiq
  namespace: kubiq-system
---
# Kubiq can observe the single-node cluster and stream pod logs, but cannot
# exec into pods, change manifests, delete workloads, or read Secret data.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: kubiq-observer
rules:
  - apiGroups: ['']
    resources:
      - namespaces
      - nodes
      - pods
      - services
      - endpoints
      - configmaps
      - events
      - persistentvolumes
      - persistentvolumeclaims
    verbs: [get, list, watch]
  - apiGroups: ['']
    resources: [pods/log]
    verbs: [get]
  - apiGroups: ['apps']
    resources: [deployments, daemonsets, statefulsets, replicasets]
    verbs: [get, list, watch]
  - apiGroups: ['networking.k8s.io']
    resources: [ingresses]
    verbs: [get, list, watch]
  - apiGroups: ['storage.k8s.io']
    resources: [storageclasses]
    verbs: [get, list, watch]
  - apiGroups: ['metrics.k8s.io']
    resources: [pods]
    verbs: [get, list]
  - apiGroups: ['autoscaling']
    resources: [horizontalpodautoscalers]
    verbs: [get, list, watch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: kubiq-observer
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: kubiq-observer
subjects:
  - kind: ServiceAccount
    name: kubiq
    namespace: kubiq-system
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: kubiq-config
  namespace: kubiq-system
data:
  # ── Server ──
  PORT: '3001'
  NODE_ENV: production
  FRONTEND_CONTEXT_PATH: /kubiq
  BACKEND_CONTEXT_PATH: /kubiq-api
  FRONTEND_DNS: https://priyanshumodi.in
  BACKEND_DNS: https://priyanshumodi.in
  CORS_ORIGIN: https://priyanshumodi.in
  # ── Service Monitoring ──
  SERVICES_CONFIG_PATH: ./data/services.ini
  POLL_INTERVAL: '30000'
  REQUEST_TIMEOUT: '5000'
  # ── Data Persistence ──
  ENABLE_PERSISTENCE: 'true'
  # ── Health Check ──
  MAX_HISTORY_SIZE: '100'
  HEALTH_CHECK_TIMEOUT: '5000'
  MAX_CONCURRENT_CHECKS: '10'
  # ── Auth (Native — Keycloak disabled) ──
  NATIVE_AUTH_ENABLED: 'true'
  KEYCLOAK_ENABLED: 'false'
  # KEYCLOAK_URL, KEYCLOAK_REALM, KEYCLOAK_CLIENT_ID not needed

  # ── Database (MongoDB) ──
  DB_TYPE: mongo
  # DB_URI goes in kubiq-runtime Secret

  # ── Feature Flags ──
  APM_ENABLED: 'true'
  K8S_METRICS_HISTORY_ENABLED: 'false'
  SYSTEM_METRICS_ENABLED: 'false'
  K8S_TERMINAL_ENABLED: 'true'
  # ── AI & Logs ──
  AI_PROVIDER: gemini
  LOG_RETENTION_DAYS: '7'
  # AI_API_KEY goes in kubiq-runtime Secret
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: kubiq
  namespace: kubiq-system
  labels:
    app.kubernetes.io/name: kubiq
spec:
  replicas: 1
  # The namespace is intentionally capped at 512 MiB. Recreate prevents a
  # rolling update from briefly needing a second 512 MiB pod.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: kubiq
  template:
    metadata:
      labels:
        app.kubernetes.io/name: kubiq
    spec:
      serviceAccountName: kubiq
      automountServiceAccountToken: true
      containers:
        - name: kubiq
          image: priyanshumodi22/kubiq:main-9 # {"$imagepolicy": "flux-system:kubiq"}
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 3001
          envFrom:
            - configMapRef:
                name: kubiq-config
            - secretRef:
                name: kubiq-runtime
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 400m
              memory: 512Mi
          readinessProbe:
            httpGet:
              path: /kubiq-api/api/health
              port: http
            initialDelaySeconds: 12
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /kubiq-api/api/health
              port: http
            initialDelaySeconds: 30
            periodSeconds: 20
            timeoutSeconds: 3
            failureThreshold: 3
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
      securityContext:
        seccompProfile:
          type: RuntimeDefault
---
apiVersion: v1
kind: Service
metadata:
  name: kubiq
  namespace: kubiq-system
spec:
  selector:
    app.kubernetes.io/name: kubiq
  ports:
    - name: http
      port: 80
      targetPort: http
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: kubiq
  namespace: kubiq-system
spec:
  ingressClassName: traefik
  rules:
    - host: priyanshumodi.in
      http:
        paths:
          - path: /kubiq-api
            pathType: Prefix
            backend:
              service:
                name: kubiq
                port:
                  name: http
          - path: /kubiq
            pathType: Prefix
            backend:
              service:
                name: kubiq
                port:
                  name: http
