apiVersion: v1
kind: Namespace
metadata:
  name: kubiq-system
  labels:
    app.kubernetes.io/part-of: kubiq
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: kubiq
  namespace: kubiq-system
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: kubi-readonly
  namespace: kubiq-system
---
# kubi receives this separate identity only for its read-only evidence tools.
# It intentionally has no exec, create, update, patch, delete, scale, or apply permission.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: kubi-readonly
rules:
  - apiGroups: ['']
    resources: [namespaces, nodes, pods, services, endpoints, configmaps, events, persistentvolumes, persistentvolumeclaims, resourcequotas, limitranges]
    verbs: [get, list, watch]
  - apiGroups: ['']
    resources: [pods/log]
    verbs: [get]
  - apiGroups: ['apps']
    resources: [deployments, daemonsets, statefulsets, replicasets]
    verbs: [get, list, watch]
  - apiGroups: ['networking.k8s.io']
    resources: [ingresses]
    verbs: [get, list, watch]
  - apiGroups: ['storage.k8s.io']
    resources: [storageclasses]
    verbs: [get, list, watch]
  - apiGroups: ['metrics.k8s.io']
    resources: [pods]
    verbs: [get, list]
  - apiGroups: ['autoscaling']
    resources: [horizontalpodautoscalers]
    verbs: [get, list, watch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: kubi-readonly
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: kubi-readonly
subjects:
  - kind: ServiceAccount
    name: kubi-readonly
    namespace: kubiq-system
---
# The host may request short-lived credentials only for the dedicated reader.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: kubi-reader-token
  namespace: kubiq-system
rules:
  - apiGroups: ['']
    resources: [serviceaccounts/token]
    resourceNames: [kubi-readonly]
    verbs: [create]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: kubi-reader-token
  namespace: kubiq-system
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: kubi-reader-token
subjects:
  - kind: ServiceAccount
    name: kubiq
    namespace: kubiq-system
---
# kubiq can observe the cluster, read Secret metadata (redacted),
# stream pod logs, and exec into pods for interactive container debugging.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: kubiq-observer
rules:
  - apiGroups: ['']
    resources:
      - namespaces
      - nodes
      - pods
      - services
      - endpoints
      - configmaps
      - secrets
      - events
      - persistentvolumes
      - persistentvolumeclaims
      - resourcequotas
      - limitranges
    verbs: [get, list, watch, create, update, patch, delete]
  - apiGroups: ['']
    resources: [pods/log, pods/exec]
    verbs: [get, create]
  - apiGroups: ['apps']
    resources: [deployments, daemonsets, statefulsets, replicasets]
    verbs: [get, list, watch, create, update, patch, delete]
  - apiGroups: ['networking.k8s.io']
    resources: [ingresses]
    verbs: [get, list, watch, create, update, patch, delete]
  - apiGroups: ['storage.k8s.io']
    resources: [storageclasses]
    verbs: [get, list, watch]
  - apiGroups: ['metrics.k8s.io']
    resources: [pods]
    verbs: [get, list]
  - apiGroups: ['autoscaling']
    resources: [horizontalpodautoscalers]
    verbs: [get, list, watch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: kubiq-observer
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: kubiq-observer
subjects:
  - kind: ServiceAccount
    name: kubiq
    namespace: kubiq-system
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: kubiq-config
  namespace: kubiq-system
data:
  # ── Server ──
  PORT: '3001'
  NODE_ENV: production
  FRONTEND_CONTEXT_PATH: /kubiq
  BACKEND_CONTEXT_PATH: /kubiq-api
  FRONTEND_DNS: https://priyanshumodi.in
  BACKEND_DNS: https://priyanshumodi.in
  CORS_ORIGIN: https://priyanshumodi.in
  # ── Service Monitoring ──
  SERVICES_CONFIG_PATH: ./data/services.ini
  POLL_INTERVAL: '30000'
  REQUEST_TIMEOUT: '5000'
  # ── Data Persistence ──
  ENABLE_PERSISTENCE: 'true'
  # ── Health Check ──
  MAX_HISTORY_SIZE: '100'
  HEALTH_CHECK_TIMEOUT: '5000'
  MAX_CONCURRENT_CHECKS: '10'
  # ── Auth (Native — Keycloak disabled) ──
  NATIVE_AUTH_ENABLED: 'true'
  KEYCLOAK_ENABLED: 'false'
  # KEYCLOAK_URL, KEYCLOAK_REALM, KEYCLOAK_CLIENT_ID not needed

  # ── Database (MongoDB) ──
  DB_TYPE: mongo
  # DB_URI is overridden by the kubiq-mongodb Secret below.
  # The original Atlas URI remains in kubiq-runtime for controlled recovery.

  # ── Feature Flags ──
  APM_ENABLED: 'true'
  K8S_METRICS_HISTORY_ENABLED: 'false'
  SYSTEM_METRICS_ENABLED: 'false'
  K8S_TERMINAL_ENABLED: 'true'
  # ── AI & Logs ──
  AI_PROVIDER: gemini
  # Explicit bootstrap model. An administrator can later select a provider and model in Profile > Kubi AI.
  AI_MODEL: gemini-2.5-flash
  AI_KUBI_ENABLED: 'true'
  AI_KUBI_HISTORY_RETENTION_DAYS: '90'
  AI_KUBI_MAX_TOOL_CALLS: '6'
  AI_KUBI_MAX_RESULTS_PER_TOOL: '50'
  AI_KUBI_MAX_CONTEXT_CHARS: '48000'
  AI_KUBI_TIMEOUT_MS: '60000'
  AI_KUBI_MAX_REQUESTS_PER_HOUR: '30'
  KUBI_KUBERNETES_NAMESPACE: kubiq-system
  APM_RETENTION_PERIOD: '3d'
  LOG_RETENTION_PERIOD: '7d'
  # AI_API_KEY goes in kubiq-runtime Secret
  # KUBIQ_INGESTION_TOKEN goes in kubiq-runtime Secret. It is required by
  # Fluent Bit and OTLP/Zipkin collectors using the public API path.

  # ── kubiq Pro licensing (Polar production) ──
  # The private KUBIQ_LICENSE_KEY remains in the kubiq-runtime Secret.
  POLAR_ENVIRONMENT: production
  POLAR_ORGANIZATION_ID: e306617c-5cf4-42cb-88e3-cf93859f4a9d
  POLAR_LICENSE_BENEFIT_ID: e89b3456-08c4-4742-8c8b-57e112c7c0c6
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: kubiq
  namespace: kubiq-system
  labels:
    app.kubernetes.io/name: kubiq
spec:
  replicas: 1
  # The namespace is intentionally capped at 512 MiB. Recreate prevents a
  # rolling update from briefly needing a second 512 MiB pod.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: kubiq
  template:
    metadata:
      labels:
        app.kubernetes.io/name: kubiq
    spec:
      serviceAccountName: kubiq
      automountServiceAccountToken: true
      containers:
        - name: kubiq
          image: priyanshumodi22/kubiq:main-177 # {"$imagepolicy": "flux-system:kubiq"}
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 3001
          envFrom:
            - configMapRef:
                name: kubiq-config
            - secretRef:
                name: kubiq-runtime
          env:
            # Pod-template settings ensure GitOps enable/rollback restarts the producer.
            - name: KUBIQ_TRACING_ENABLED
              value: 'true'
            # Explicitly approved detailed commands; credentials are redacted before export.
            - name: KUBIQ_TRACING_QUERY_DETAILS
              value: 'true'
            - name: OTEL_SERVICE_NAME
              value: kubiq-backend
            - name: OTEL_EXPORTER_OTLP_TRACES_ENDPOINT
              value: http://127.0.0.1:3001/kubiq-api/api/apm/v1/traces
            - name: DB_URI
              valueFrom:
                secretKeyRef:
                  name: kubiq-mongodb
                  key: DB_URI
          resources:
            requests:
              cpu: 50m
              memory: 192Mi
            limits:
              cpu: 400m
              memory: 512Mi
          readinessProbe:
            httpGet:
              path: /kubiq-api/api/health
              port: http
            initialDelaySeconds: 12
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /kubiq-api/api/health
              port: http
            initialDelaySeconds: 30
            periodSeconds: 20
            timeoutSeconds: 3
            failureThreshold: 3
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
      securityContext:
        seccompProfile:
          type: RuntimeDefault
---
apiVersion: v1
kind: Service
metadata:
  name: kubiq
  namespace: kubiq-system
spec:
  selector:
    app.kubernetes.io/name: kubiq
  ports:
    - name: http
      port: 80
      targetPort: http
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: kubiq
  namespace: kubiq-system
spec:
  ingressClassName: traefik
  rules:
    - host: priyanshumodi.in
      http:
        paths:
          - path: /kubiq-api
            pathType: Prefix
            backend:
              service:
                name: kubiq
                port:
                  name: http
          - path: /kubiq
            pathType: Prefix
            backend:
              service:
                name: kubiq
                port:
                  name: http
