name: Build Kubiq image for Flux

on:
  push:
    branches: [main]
    paths:
      - Dockerfile
      - backend/**
      - frontend/**
      - .github/workflows/gcp-k3s.yml
  workflow_dispatch:

concurrency:
  group: kubiq-production
  cancel-in-progress: true

permissions:
  contents: read

env:
  IMAGE_NAME: priyanshumodi22/kubiq
  IMAGE_TAG: sha-${{ github.sha }}
  FLUX_TAG: main-${{ github.run_number }}

jobs:
  verify:
    name: Verify application builds
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: |
            backend/package-lock.json
            frontend/package-lock.json
      - run: npm ci --prefix backend
      - run: npm run build --prefix backend
      - run: npm ci --prefix frontend
      - run: npm run build --prefix frontend
        env:
          VITE_FRONTEND_BASE_PATH: /kubiq/
          VITE_BACKEND_CONTEXT_PATH: /kubiq-api

  build-and-push:
    name: Build and publish image
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: |
            ${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }}
            ${{ env.IMAGE_NAME }}:${{ env.FLUX_TAG }}
            ${{ env.IMAGE_NAME }}:latest
          build-args: |
            VITE_FRONTEND_BASE_PATH=/kubiq/
            VITE_BACKEND_CONTEXT_PATH=/kubiq-api
          cache-from: type=gha
          cache-to: type=gha,mode=max
