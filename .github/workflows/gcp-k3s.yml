name: Build Kubiq image for Flux

on:
  push:
    branches: [main]
    paths:
      - Dockerfile
      - backend/**
      - frontend/**
      - kubiq-apm/**
      - .github/workflows/gcp-k3s.yml
  workflow_dispatch:

concurrency:
  group: kubiq-production
  cancel-in-progress: true

permissions:
  contents: read
  actions: read

env:
  IMAGE_NAME: priyanshumodi22/kubiq
  IMAGE_TAG: sha-${{ github.sha }}
  FLUX_TAG: main-${{ github.run_number }}

jobs:
  verify:
    name: Verify application builds
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: |
            backend/package-lock.json
            frontend/package-lock.json
      - run: npm ci --prefix backend
      - run: node scripts/generate-apm-guide.cjs --check
      - run: node --test .github/scripts/*.test.cjs
      - run: python3 -m unittest discover -s ops/sonarqube -p 'test_*.py'
      - run: node scripts/verify-sonar-ledger.cjs
      - run: python3 -m unittest discover -s kubiq-apm/python -p test_wrapper.py
      - run: node --test kubiq-apm/node/exporter.test.cjs
      - run: npm run lint --prefix backend
      - run: npm test --prefix backend -- --runInBand
      - run: npm run build --prefix backend
      - run: npm ci --prefix frontend
      - run: npm run lint --prefix frontend
      - run: npm test --prefix frontend -- --run
      - run: npm run build --prefix frontend
        env:
          VITE_FRONTEND_BASE_PATH: /kubiq/
          VITE_BACKEND_CONTEXT_PATH: /kubiq-api

  build-and-push:
    name: Build and publish image
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Require exact-commit Sonar release approval
        run: node .github/scripts/verify-sonar-release.cjs
        env:
          GITHUB_TOKEN: ${{ github.token }}
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: false
          load: true
          tags: |
            ${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }}
            ${{ env.IMAGE_NAME }}:${{ env.FLUX_TAG }}
            ${{ env.IMAGE_NAME }}:latest
          build-args: |
            VITE_FRONTEND_BASE_PATH=/kubiq/
            VITE_BACKEND_CONTEXT_PATH=/kubiq-api
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Recheck approval immediately before publishing
        run: |
          node .github/scripts/verify-sonar-release.cjs
          docker push "$IMAGE_NAME:$IMAGE_TAG"
          docker push "$IMAGE_NAME:$FLUX_TAG"
          docker push "$IMAGE_NAME:latest"
        env:
          GITHUB_TOKEN: ${{ github.token }}
