name: Verify packaged APM SDK
on:
  workflow_call:
permissions:
  contents: read
jobs:
  packaged-runtime:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: ['20', '22']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - run: node scripts/verify-apm-package.cjs
