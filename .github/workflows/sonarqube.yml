name: SonarQube release scan

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sonarqube-release-scan
  cancel-in-progress: false

jobs:
  scan:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm ci --prefix backend
      - run: npm ci --prefix frontend
      - run: python3 -m unittest discover -s kubiq-apm/python -p test_wrapper.py
      - run: node --test kubiq-apm/node/exporter.test.cjs
      - name: Generate coverage reports
        run: |
          npm run test:coverage --prefix backend
          npm run test:coverage --prefix frontend
          test -s backend/coverage/lcov.info
          test -s frontend/coverage/lcov.info
      - uses: actions/upload-artifact@v4
        with:
          name: coverage-${{ github.sha }}
          path: |
            backend/coverage/lcov.info
            frontend/coverage/lcov.info
          if-no-files-found: error
      - name: Start Cloudflare Access adapter
        env:
          CF_ACCESS_CLIENT_ID: ${{ secrets.CF_ACCESS_CLIENT_ID }}
          CF_ACCESS_CLIENT_SECRET: ${{ secrets.CF_ACCESS_CLIENT_SECRET }}
        run: |
          node .github/scripts/sonar-access-proxy.cjs &
          for attempt in $(seq 1 20); do
            if curl --fail --silent http://127.0.0.1:19000/api/system/status | python3 -c 'import json,sys; sys.exit(0 if json.load(sys.stdin).get("status") == "UP" else 1)' 2>/dev/null; then exit 0; fi
            sleep 3
          done
          echo 'SonarQube is unavailable through Cloudflare Access.' >&2
          exit 1
      - name: Analyze kubiq
        uses: SonarSource/sonarqube-scan-action@59db25f34e16620e48ab4bb9e4a5dce155cb5432 # v8.0.0
        env:
          SONAR_HOST_URL: http://127.0.0.1:19000
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        with:
          args: >
            -Dsonar.projectKey=kubiq
            -Dsonar.qualitygate.wait=true
            -Dsonar.qualitygate.timeout=600
            -Dsonar.scm.revision=${{ github.sha }}
            -Dsonar.projectVersion=${{ github.sha }}
      - name: Verify strict release criteria
        run: node .github/scripts/verify-sonar-analysis.cjs
        env:
          SONAR_HOST_URL: http://127.0.0.1:19000
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
      - uses: actions/upload-artifact@v4
        with:
          name: sonar-release-proof-${{ github.sha }}
          path: .sonar-release-proof.json
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 30
      - name: Report scan outcome
        if: always()
        env:
          SCAN_STATUS: ${{ job.status }}
        run: |
          printf 'SonarQube scan status: %s\n\n' "$SCAN_STATUS" >> "$GITHUB_STEP_SUMMARY"
          printf '[SonarQube results](https://sonar.priyanshumodi.in/dashboard?id=kubiq)\n\n' >> "$GITHUB_STEP_SUMMARY"
          printf '[Persistent Google Sheets reports](https://docs.google.com/spreadsheets/d/1C7G0-c7mjQkQ3ur57u20mdv-XPIXWVBxWwgwyNHQqGY/edit)\n' >> "$GITHUB_STEP_SUMMARY"
