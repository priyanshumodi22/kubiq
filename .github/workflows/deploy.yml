name: Build and Publish Docker Image

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Require exact-commit Sonar release approval
        run: node .github/scripts/verify-sonar-release.cjs
        env:
          GITHUB_TOKEN: ${{ github.token }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Extract metadata (tags, labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: priyanshumodi22/kubiq
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable=${{ github.event_name == 'release' }}

      - name: Recheck release gates before image publication
        run: node .github/scripts/verify-sonar-release.cjs
        env:
          GITHUB_TOKEN: ${{ github.token }}

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  build-binaries:
    name: Package Linux (${{ matrix.arch }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - arch: x64
            platform: linux/amd64
            asset: amd64
          - arch: arm64
            platform: linux/arm64
            asset: arm64
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Require exact-commit release approval
        run: node .github/scripts/verify-sonar-release.cjs
        env:
          GITHUB_TOKEN: ${{ github.token }}
      - uses: docker/setup-qemu-action@v3
      - name: Build, package and smoke-test supported runtime
        run: |
          docker run --rm --platform ${{ matrix.platform }} \
            -e RELEASE_ARCH=${{ matrix.arch }} -e RELEASE_ASSET=${{ matrix.asset }} \
            -e RELEASE_SHA=${{ github.sha }} -e RELEASE_VERSION=${{ github.ref_name }} \
            -v "${{ github.workspace }}:/workspace" -w /workspace node:22-bookworm-slim \
            bash -euc '
              apt-get update && apt-get install -y --no-install-recommends python3 make g++ zip
              npm ci --prefix frontend
              npm run build --prefix frontend
              npm ci --prefix backend
              npm run build --prefix backend
              npm run build:ncc --prefix backend
              npm ci --prefix telemetry --omit=dev --ignore-scripts
              node --test scripts/package-linux.test.cjs
              node scripts/package-linux.cjs "$RELEASE_ARCH" "release-$RELEASE_ASSET" /usr/local/bin/node
              "./release-$RELEASE_ASSET/kubiq" --check
              "./release-$RELEASE_ASSET/kubiq" --version
              node scripts/smoke-linux.cjs "release-$RELEASE_ASSET"
              cd "release-$RELEASE_ASSET"
              zip -qr "../kubiq-linux-$RELEASE_ASSET.zip" .
            '
      - name: Recheck release gates before asset publication
        if: github.event_name == 'release'
        run: node .github/scripts/verify-sonar-release.cjs
        env:
          GITHUB_TOKEN: ${{ github.token }}
      - uses: softprops/action-gh-release@v2
        if: github.event_name == 'release'
        with:
          files: kubiq-linux-${{ matrix.asset }}.zip
