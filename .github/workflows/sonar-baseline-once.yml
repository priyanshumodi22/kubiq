name: Pin approved Sonar baseline once
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  pin:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Start Cloudflare Access adapter
        env:
          CF_ACCESS_CLIENT_ID: ${{ secrets.CF_ACCESS_CLIENT_ID }}
          CF_ACCESS_CLIENT_SECRET: ${{ secrets.CF_ACCESS_CLIENT_SECRET }}
        run: |
          node .github/scripts/sonar-access-proxy.cjs &
          for attempt in $(seq 1 20); do
            if curl --fail --silent http://127.0.0.1:19000/api/system/status | python3 -c 'import json,sys; sys.exit(0 if json.load(sys.stdin).get("status") == "UP" else 1)' 2>/dev/null; then exit 0; fi
            sleep 3
          done
          exit 1
      - name: Pin fixed analysis and revoke temporary token
        run: node .github/scripts/pin-sonar-baseline.cjs
        env:
          SONAR_HOST_URL: http://127.0.0.1:19000
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_BASELINE_ADMIN_TOKEN: ${{ secrets.SONAR_BASELINE_ADMIN_TOKEN }}
          SONAR_BASELINE_TOKEN_NAME: kubiq-baseline-once-20261024
